<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient-education" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#gradient-education)" />
  
  <!-- Books -->
  <rect x="150" y="120" width="100" height="15" fill="rgba(255,255,255,0.3)" />
  <rect x="160" y="105" width="80" height="15" fill="rgba(255,255,255,0.25)" />
  <rect x="170" y="90" width="60" height="15" fill="rgba(255,255,255,0.3)" />
  
  <!-- Graduation cap -->
  <rect x="180" y="160" width="40" height="20" fill="rgba(255,255,255,0.3)" />
  <polygon points="160,160 200,140 240,160" fill="rgba(255,255,255,0.4)" />
  
  <!-- Girl figures -->
  <circle cx="100" cy="210" r="15" fill="rgba(255,255,255,0.3)" />
  <rect x="90" y="225" width="20" height="35" fill="rgba(255,255,255,0.25)" />
  
  <circle cx="140" cy="205" r="15" fill="rgba(255,255,255,0.3)" />
  <rect x="130" y="220" width="20" height="40" fill="rgba(255,255,255,0.25)" />
  
  <circle cx="260" cy="210" r="15" fill="rgba(255,255,255,0.3)" />
  <rect x="250" y="225" width="20" height="35" fill="rgba(255,255,255,0.25)" />
  
  <circle cx="300" cy="205" r="15" fill="rgba(255,255,255,0.3)" />
  <rect x="290" y="220" width="20" height="40" fill="rgba(255,255,255,0.25)" />
  
  <text x="200" y="285" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Girl Child Education</text>
</svg> 