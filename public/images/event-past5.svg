<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient-defense" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#gradient-defense)" />
  
  <!-- Training figures -->
  <circle cx="150" cy="150" r="20" fill="rgba(255,255,255,0.3)" />
  <rect x="135" y="170" width="30" height="50" fill="rgba(255,255,255,0.25)" />
  <!-- Arms extended -->
  <rect x="120" y="180" width="20" height="5" fill="rgba(255,255,255,0.3)" />
  <rect x="165" y="180" width="20" height="5" fill="rgba(255,255,255,0.3)" />
  
  <circle cx="250" cy="155" r="18" fill="rgba(255,255,255,0.3)" />
  <rect x="237" y="173" width="26" height="45" fill="rgba(255,255,255,0.25)" />
  <!-- Kicking pose -->
  <rect x="263" y="195" width="25" height="8" fill="rgba(255,255,255,0.3)" />
  
  <!-- Shield symbol -->
  <path d="M 320 120 L 340 110 L 360 120 L 360 150 L 340 160 L 320 150 Z" fill="rgba(255,255,255,0.3)" />
  
  <!-- Target/focus pad -->
  <circle cx="80" cy="180" r="25" fill="rgba(255,255,255,0.2)" />
  <circle cx="80" cy="180" r="15" fill="rgba(255,255,255,0.3)" />
  <circle cx="80" cy="180" r="5" fill="rgba(255,255,255,0.4)" />
  
  <text x="200" y="270" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Self-Defense Training</text>
</svg> 