<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient-skill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#gradient-skill)" />
  
  <!-- Computer/laptop -->
  <rect x="120" y="120" width="160" height="100" fill="rgba(255,255,255,0.2)" />
  <rect x="130" y="130" width="140" height="80" fill="rgba(255,255,255,0.3)" />
  <rect x="180" y="220" width="40" height="20" fill="rgba(255,255,255,0.2)" />
  
  <!-- Person -->
  <circle cx="320" cy="150" r="20" fill="rgba(255,255,255,0.3)" />
  <rect x="305" y="170" width="30" height="50" fill="rgba(255,255,255,0.25)" />
  
  <!-- Books/materials -->
  <rect x="50" y="200" width="20" height="30" fill="rgba(255,255,255,0.3)" />
  <rect x="75" y="195" width="20" height="35" fill="rgba(255,255,255,0.25)" />
  <rect x="100" y="190" width="20" height="40" fill="rgba(255,255,255,0.3)" />
  
  <text x="200" y="270" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Skill Development</text>
</svg> 