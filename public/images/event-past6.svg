<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient-distribution" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333EA;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#gradient-distribution)" />
  
  <!-- Distribution table -->
  <rect x="120" y="160" width="160" height="80" fill="rgba(255,255,255,0.2)" />
  
  <!-- Boxes/packages -->
  <rect x="140" y="140" width="30" height="20" fill="rgba(255,255,255,0.3)" />
  <rect x="180" y="135" width="25" height="25" fill="rgba(255,255,255,0.3)" />
  <rect x="220" y="140" width="30" height="20" fill="rgba(255,255,255,0.3)" />
  
  <!-- People receiving -->
  <circle cx="80" cy="200" r="15" fill="rgba(255,255,255,0.3)" />
  <rect x="70" y="215" width="20" height="35" fill="rgba(255,255,255,0.25)" />
  <!-- Package in hand -->
  <rect x="65" y="220" width="8" height="12" fill="rgba(255,255,255,0.4)" />
  
  <circle cx="320" cy="205" r="15" fill="rgba(255,255,255,0.3)" />
  <rect x="310" y="220" width="20" height="30" fill="rgba(255,255,255,0.25)" />
  <!-- Package in hand -->
  <rect x="327" y="225" width="8" height="12" fill="rgba(255,255,255,0.4)" />
  
  <!-- Volunteer/distributor -->
  <circle cx="200" cy="130" r="18" fill="rgba(255,255,255,0.3)" />
  <rect x="187" y="148" width="26" height="40" fill="rgba(255,255,255,0.25)" />
  
  <text x="200" y="285" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Product Distribution</text>
</svg> 